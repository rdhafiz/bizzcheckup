# --- Services: mapped to failing report categories ---------------------------
# related_categories must match the engine's category ids:
# performance | accessibility | best_practices | seo | agentic
services:
  - name: Speed & Core Web Vitals Optimisation
    description: >
      Faster pages keep visitors and rank higher. I optimise images, loading,
      caching and server response so your site passes Google's Core Web Vitals.
    related_categories: [performance]

  - name: Technical SEO & Structured Data
    description: >
      Get found on Google. I fix titles, metadata, sitemaps, broken links and add
      rich structured data so search engines understand your business.
    related_categories: [seo]

  - name: Accessibility Fixes (WCAG)
    description: >
      Reach every customer and reduce legal risk. I make your site usable with
      screen readers, keyboards and for people with visual impairments.
    related_categories: [accessibility]

  - name: Security Hardening & Best Practices
    description: >
      Protect your customers and reputation. I set up HTTPS, security headers,
      safe cookies and update outdated libraries.
    related_categories: [best_practices]

  - name: AI-Ready Website (Agentic Browsing)
    description: >
      Be visible in ChatGPT, Claude and AI search. I add llms.txt, AI crawler
      rules, structured data and semantic markup so AI agents can read and
      recommend your business.
    related_categories: [agentic]

  - name: Custom Web App & Website Rebuild
    description: >
      When patching isn't enough, I design and build a modern, fast, secure
      website or business system — Laravel, React/Next.js, Vue or Django.
    related_categories: [performance, seo, accessibility, best_practices, agentic]


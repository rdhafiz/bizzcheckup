{% load bizz %}{% comment %}
  The report email. Email programs ignore stylesheets and strip <style>, so every style
  is written on the element itself, and the layout is a single 560 px table. (Emails
  aren't web pages: the site's Content Security Policy doesn't apply to them.)
{% endcomment %}<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Your {{ brand.product_name }} report</title></head>
<body style="margin:0;padding:0;background:#f7f6f2;font-family:Arial,Helvetica,sans-serif;color:#0e1b1e;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f7f6f2;padding:24px 12px;">
<tr><td align="center">
  <table role="presentation" width="560" cellpadding="0" cellspacing="0" style="max-width:560px;width:100%;background:#ffffff;border:1px solid #e2ded4;border-radius:16px;">
    <tr><td style="padding:24px 28px 0;">
      <p style="margin:0;font-size:18px;font-weight:bold;"><span style="color:#1d8047;">Bizz</span>Checkup</p>
    </td></tr>
    <tr><td style="padding:20px 28px 0;">
      <p style="margin:0;font-size:13px;letter-spacing:2px;text-transform:uppercase;color:#1d8047;font-weight:bold;">Your health report</p>
      <h1 style="margin:8px 0 0;font-size:24px;line-height:1.25;">{{ checkup.domain }}</h1>
    </td></tr>
    <tr><td style="padding:20px 28px 0;">
      <table role="presentation" cellpadding="0" cellspacing="0" style="background:#0c1517;border-radius:12px;width:100%;">
        <tr><td style="padding:18px 20px;">
          <p style="margin:0;font-size:13px;color:#a9bcb7;">Health score</p>
          <p style="margin:4px 0 0;font-size:40px;font-weight:bold;color:#ffffff;line-height:1;">{{ checkup.health_score }}<span style="font-size:18px;color:#a9bcb7;">/100</span></p>
          <p style="margin:8px 0 0;font-size:14px;font-weight:bold;color:{% with band=checkup.health_score|band %}{% if band == "urgent" %}#f97066{% elif band == "attention" %}#fdb022{% else %}#5cc98a{% endif %}{% endwith %};">{{ checkup.health_score|band_label }}</p>
        </td></tr>
      </table>
    </td></tr>
    {% if problems %}
    <tr><td style="padding:24px 28px 0;">
      <p style="margin:0;font-size:16px;font-weight:bold;">Fix these first</p>
      {% for problem in problems %}
        <p style="margin:10px 0 0;font-size:14px;line-height:1.5;"><strong style="color:#b42318;">{{ forloop.counter }}.</strong> {{ problem }}</p>
      {% endfor %}
    </td></tr>
    {% endif %}
    <tr><td style="padding:24px 28px 0;">
      <a href="{{ link }}" style="display:inline-block;background:#31ac64;color:#ffffff;text-decoration:none;font-weight:bold;font-size:15px;padding:12px 22px;border-radius:10px;">Open the full report</a>
      <p style="margin:12px 0 0;font-size:13px;color:#56635f;">Every issue, why it matters and how to fix it. The PDF is attached{% if pdf_link %} (or <a href="{{ pdf_link }}" style="color:#1d8047;">download it</a>){% endif %}.</p>
    </td></tr>
    <tr><td style="padding:24px 28px 28px;">
      <p style="margin:0;padding-top:18px;border-top:1px solid #e2ded4;font-size:14px;line-height:1.5;">Want help fixing these? <strong>Just reply to this email</strong>: it goes straight to {{ brand.name }}.</p>
    </td></tr>
  </table>
  <p style="margin:16px 0 0;font-size:12px;color:#56635f;">{{ brand.footer_note }}<br>You're getting this email because someone asked for this report on {{ brand.product_name }}.</p>
</td></tr>
</table>
</body>
</html>

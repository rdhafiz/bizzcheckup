<svg xmlns="http://www.w3.org/2000/svg" width="{{ size.width }}" height="{{ height }}" viewBox="0 0 {{ size.width }} {{ height }}" role="img" aria-label="{{ product_name }} health score {{ score }} out of 100: {{ label }}">
  <title>{{ product_name }} health score {{ score }}/100: {{ label }}</title>
  <defs>
    <clipPath id="r"><rect width="{{ size.width }}" height="{{ height }}" rx="10"/></clipPath>
  </defs>
  <g clip-path="url(#r)">
    <rect width="{{ size.width }}" height="{{ height }}" fill="#0c1517"/>
    <rect x="{{ size.split }}" width="{{ size.width }}" height="{{ height }}" fill="{{ colour }}"/>
  </g>
  <rect x="12" y="11" width="22" height="22" rx="6" fill="#31ac64"/>
  <path d="M15 22.5h4l1.8-4.5 3 9 2.2-6.5 1.4 2H31" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
  <g font-family="Verdana, DejaVu Sans, Arial, sans-serif" fill="#fff">
    <text x="42" y="20" font-size="10" fill="#a9bcb7">Checked by</text>
    <text x="42" y="33" font-size="12" font-weight="bold">{{ product_name }}</text>
    <text x="{{ size.score_x }}" y="25" font-size="20" font-weight="bold" text-anchor="middle" fill="{{ text_colour }}">{{ score }}</text>
    <text x="{{ size.score_x }}" y="37" font-size="7.5" text-anchor="middle" fill="{{ text_colour }}">{{ label|upper }}</text>
  </g>
</svg>

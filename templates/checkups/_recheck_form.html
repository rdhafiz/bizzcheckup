{# "Check again now": a fresh check-up of the same site (POST, so it needs CSRF). #}
<form method="post" action="{% url 'checkups:recheck' checkup.pk %}" class="{{ form_class|default:'inline-flex flex-wrap items-center gap-3' }}">
  {% csrf_token %}
  {% if turnstile_site_key %}<div class="cf-turnstile" data-sitekey="{{ turnstile_site_key }}"></div>{% endif %}
  <button type="submit" class="{{ button_class|default:'btn-secondary' }}">
    <svg class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/>
    </svg>
    Check again now
  </button>
</form>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" width="640" height="560">
  <!-- Illustration for the homepage "A healthier website means" section (decorative). -->
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6efe4"/>
      <stop offset="0.55" stop-color="#ead9c2"/>
      <stop offset="1" stop-color="#cdb08c"/>
    </linearGradient>
    <radialGradient id="light" cx="0.25" cy="0.15" r="0.7">
      <stop offset="0" stop-color="#fffaf0" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#fffaf0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="table" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c79a6b"/>
      <stop offset="1" stop-color="#9c6f45"/>
    </linearGradient>
    <linearGradient id="mug" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fbf7f0"/>
      <stop offset="0.7" stop-color="#f1e9dc"/>
      <stop offset="1" stop-color="#ddd0bc"/>
    </linearGradient>
    <linearGradient id="pages" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf6ea"/>
      <stop offset="1" stop-color="#e7dcc6"/>
    </linearGradient>
  </defs>

  <rect width="640" height="560" fill="url(#wall)"/>
  <rect width="640" height="560" fill="url(#light)"/>
  <!-- soft window shapes in the background -->
  <rect x="380" y="-20" width="90" height="240" rx="6" fill="#fffaf0" opacity="0.35"/>
  <rect x="490" y="-20" width="90" height="240" rx="6" fill="#fffaf0" opacity="0.25"/>

  <!-- table -->
  <path d="M0 400 L640 380 L640 560 L0 560 Z" fill="url(#table)"/>
  <path d="M0 400 L640 380" stroke="#e2c29c" stroke-width="3" opacity="0.6"/>

  <!-- notebook and pen -->
  <g transform="rotate(-6 250 500)">
    <rect x="120" y="455" width="260" height="120" rx="6" fill="#f8f4ec"/>
    <path d="M150 485h190M150 505h190M150 525h150" stroke="#d8cfbf" stroke-width="2"/>
    <rect x="300" y="440" width="170" height="10" rx="5" fill="#22262a" transform="rotate(-18 300 440)"/>
  </g>

  <!-- stack of books -->
  <g font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="25" letter-spacing="1.5" fill="#f3efe6">
    <g transform="translate(0 0)">
      <rect x="-10" y="372" width="330" height="58" rx="4" fill="#20384a"/>
      <rect x="300" y="377" width="26" height="48" fill="url(#pages)"/>
      <text x="22" y="410">REAL GROWTH</text>
    </g>
    <g>
      <rect x="-14" y="312" width="342" height="60" rx="4" fill="#2a4a60"/>
      <rect x="310" y="317" width="24" height="50" fill="url(#pages)"/>
      <text x="22" y="351">MORE CUSTOMERS</text>
    </g>
    <g>
      <rect x="-6" y="256" width="322" height="56" rx="4" fill="#1d3344"/>
      <rect x="298" y="261" width="24" height="46" fill="url(#pages)"/>
      <text x="22" y="293">BETTER SEO</text>
    </g>
    <g>
      <rect x="-12" y="200" width="328" height="56" rx="4" fill="#2c4e66"/>
      <rect x="300" y="205" width="24" height="46" fill="url(#pages)"/>
      <text x="22" y="237">FASTER SITE</text>
    </g>
    <path d="M-12 256h328M-6 312h322M-14 372h342" stroke="#0e1b24" stroke-width="2" opacity="0.5"/>
  </g>

  <!-- mug -->
  <ellipse cx="470" cy="420" rx="110" ry="14" fill="#6e4a2c" opacity="0.35"/>
  <path d="M390 150 h160 v230 a32 32 0 0 1 -32 32 h-96 a32 32 0 0 1 -32 -32 z" fill="url(#mug)"/>
  <ellipse cx="470" cy="150" rx="80" ry="14" fill="#efe6d8"/>
  <ellipse cx="470" cy="152" rx="70" ry="10" fill="#6b4226"/>
  <path d="M550 200 c48 0 60 30 56 62 c-4 34 -30 54 -56 56" fill="none" stroke="#e9dfcf" stroke-width="20" stroke-linecap="round"/>
  <path d="M550 200 c48 0 60 30 56 62 c-4 34 -30 54 -56 56" fill="none" stroke="#d6c8b2" stroke-width="2" opacity="0.6"/>
  <g font-family="'Segoe Print', 'Bradley Hand', 'Comic Sans MS', cursive" font-size="27" fill="#1d2a30" text-anchor="middle">
    <text x="470" y="220">A</text>
    <text x="470" y="254">Healthier</text>
    <text x="470" y="288">Website</text>
    <text x="470" y="330">A Stronger</text>
    <text x="470" y="364">Business</text>
  </g>
  <path d="M458 380 q12 10 24 0" fill="none" stroke="#1d2a30" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="462" cy="373" r="1.8" fill="#1d2a30"/><circle cx="478" cy="373" r="1.8" fill="#1d2a30"/>

  <!-- sparkle strokes -->
  <path d="M590 90l14-20M612 108l22-6M600 60l4-22" stroke="#14857a" stroke-width="4" stroke-linecap="round"/>
  <path d="M352 120l-16-14M346 146l-22 0M360 98l-6-20" stroke="#1d2a30" stroke-width="4" stroke-linecap="round"/>
</svg>

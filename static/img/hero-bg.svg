<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" preserveAspectRatio="xMidYMid slice">
  <!--
    Homepage hero background: a softly blurred office desk (decorative).
    To use a real photo instead, save it as static/img/hero-bg.jpg (about 1920x1080,
    under 300 KB) and change the url() in .hero-full in frontend/tailwind.css.
  -->
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="0.6">
      <stop offset="0" stop-color="#2b3b3d"/>
      <stop offset="0.5" stop-color="#5a5348"/>
      <stop offset="1" stop-color="#c9a77c"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.8" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#ffe9c4" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffe9c4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="desk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a6442"/>
      <stop offset="1" stop-color="#3e2a1c"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e9f5f2"/>
      <stop offset="1" stop-color="#bfe0d9"/>
    </linearGradient>
    <filter id="far" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="mid" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="4"/></filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#wall)"/>

  <!-- window and bokeh, far away -->
  <g filter="url(#far)">
    <rect x="1180" y="-40" width="300" height="620" fill="#f6dcb0" opacity="0.55"/>
    <rect x="1520" y="-40" width="300" height="620" fill="#f6dcb0" opacity="0.45"/>
    <circle cx="300" cy="220" r="60" fill="#e8c48d" opacity="0.35"/>
    <circle cx="520" cy="140" r="36" fill="#f2d6a8" opacity="0.4"/>
    <circle cx="880" cy="260" r="48" fill="#d9b483" opacity="0.3"/>
    <circle cx="1040" cy="120" r="28" fill="#fbe3bb" opacity="0.5"/>
    <!-- plant -->
    <path d="M150 760 C120 560 60 480 40 380 C140 460 190 560 200 740z" fill="#2f5b3e"/>
    <path d="M210 760 C230 540 300 440 360 360 C340 500 290 620 260 760z" fill="#3b6f4b"/>
    <path d="M180 760 C170 600 190 500 230 420 C250 540 230 660 220 760z" fill="#2a4f36"/>
  </g>
  <rect width="1920" height="1080" fill="url(#sun)"/>

  <!-- desk -->
  <path d="M0 780 L1920 740 L1920 1080 L0 1080z" fill="url(#desk)"/>

  <!-- laptop, a little out of focus -->
  <g filter="url(#mid)">
    <path d="M1010 330 L1600 300 L1620 720 L1000 740z" fill="#1a2224"/>
    <path d="M1030 352 L1580 324 L1598 700 L1022 718z" fill="url(#screen)"/>
    <circle cx="1170" cy="520" r="78" fill="none" stroke="#15803d" stroke-width="20"/>
    <rect x="1300" y="430" width="230" height="22" rx="8" fill="#ffffff" opacity="0.9"/>
    <rect x="1300" y="472" width="200" height="22" rx="8" fill="#ffffff" opacity="0.9"/>
    <rect x="1300" y="514" width="220" height="22" rx="8" fill="#ffffff" opacity="0.9"/>
    <rect x="1300" y="556" width="170" height="22" rx="8" fill="#ffffff" opacity="0.9"/>
    <rect x="1300" y="598" width="190" height="22" rx="8" fill="#ffffff" opacity="0.9"/>
    <path d="M960 740 L1660 716 L1720 772 L900 800z" fill="#aab2b6"/>
  </g>

  <!-- coffee cup and notebook -->
  <g filter="url(#mid)">
    <ellipse cx="860" cy="842" rx="120" ry="22" fill="#e6dfd4"/>
    <path d="M780 700 h160 l-14 130 a20 20 0 0 1 -20 18 h-92 a20 20 0 0 1 -20 -18z" fill="#f5f1ea"/>
    <ellipse cx="860" cy="702" rx="80" ry="16" fill="#5e3a22"/>
    <path d="M940 730 c40 0 46 50 4 70" fill="none" stroke="#efe9df" stroke-width="16"/>
    <path d="M340 900 L760 870 L800 1000 L330 1040z" fill="#f4efe5"/>
    <path d="M380 930 L720 906 M386 960 L730 936 M392 990 L620 974" stroke="#cfc6b6" stroke-width="5"/>
  </g>
</svg>
